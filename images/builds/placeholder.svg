<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#7a4a2b"/>
      <rect width="32" height="32" fill="none" stroke="#5d3520" stroke-width="2"/>
      <rect x="4" y="4" width="10" height="10" fill="#8a5632"/>
      <rect x="18" y="16" width="8" height="8" fill="#6b3f24"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect x="120" y="130" width="400" height="140" fill="#1a1a2e" opacity="0.85" stroke="#8f8f8f" stroke-width="4"/>
  <text x="320" y="190" text-anchor="middle" font-family="monospace" font-size="22" fill="#f0c040">YOUR BUILD</text>
  <text x="320" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#e8e8e8">Drop your screenshot in images/builds/</text>
  <text x="320" y="250" text-anchor="middle" font-family="monospace" font-size="14" fill="#e8e8e8">and update this image in index.html</text>
</svg>